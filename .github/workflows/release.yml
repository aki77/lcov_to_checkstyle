on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    env:
      EXT: ${{ matrix.target == 'x86_64-pc-windows-gnu' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Compile
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true
      - name: Rename binary
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/lcov_to_checkstyle${EXT} dist/lcov_to_checkstyle-${{ matrix.target }}${EXT}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov_to_checkstyle-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Immutable releases では公開後にアセットを追加できないため、全アセットを揃えてからリリースを作成する
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*
